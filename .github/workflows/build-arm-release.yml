name: Build ARM release binary

# FORK-ONLY VARIANT (trams/cedar-server branch `tetra3rs`): builds the tetra3rs
# flavour. It differs from main's workflow in that it triggers on the tetra3rs
# branch, checks out tetra3rs, builds cedar-server-tetra3rs (Provides/Conflicts
# cedar-server) and builds cedar-tetra3rs-db, the pattern database that package
# depends on. Lines that differ are marked "tetra3rs:".

# Builds a release cedar-box-server for the Raspberry Pi, packages it as a .deb,
# and publishes both.
#
#   push to main    -> workflow artifact (downloadable for ~90 days)
#   push of a v* tag -> the same files, additionally attached to a GitHub Release
#
# The whole job runs INSIDE the Debian bookworm builder image published by
# build-image.yml. That is the point of the exercise: the ubuntu-24.04-arm
# runner's own userland is glibc 2.39, so a binary built directly on it links
# GLIBC_2.38+ symbols and dies on the Pi (Raspberry Pi OS bookworm, glibc 2.36)
# with "GLIBC_2.38 not found". The container pins the userland to bookworm, and
# supplies the Raspberry Pi archive's libcamera so --features rpi-camera links
# the same versioned soname the Pi provides (libcamera.so.0.5).
#
# The "Verify ABI" step below asserts both of those properties on the finished
# binary, so a regression fails loudly here instead of silently shipping
# something that won't start on the target.
#
# Scope note: the .deb (packaging/deb/) contains the server binary only, plus a
# drop-in that points the Cedar image's cedar.service at it and a postinst that
# applies the file capabilities. The Flutter app and the python/tetra3
# environment are deliberately out of scope; they still come from the image.

on:
  push:
    # `branches` and `tags` are OR-ed: this fires on a push to main and on a
    # push of any v* tag.
    branches: [tetra3rs]  # tetra3rs: main builds use main's copy of this file
    tags: ['v*']
  workflow_dispatch:

concurrency:
  # Serialize per ref. Superseded main builds are cancelled, but a tag build is
  # never cancelled -- it may already have created a Release.
  group: arm-release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  # Sibling repos, tracked at their default branch, matching ci.yml. Replace a
  # _REF with a commit SHA to pin that sibling if its tip ever breaks the build.
  # The resolved SHAs are recorded in the job summary of every run, so an
  # artifact can always be traced back to the exact sibling state it was built
  # from.
  CEDAR_CAMERA_REPO: smroid/cedar-camera
  CEDAR_CAMERA_REF: main
  CEDAR_DETECT_REPO: smroid/cedar-detect
  CEDAR_DETECT_REF: main
  TETRA3_SERVER_REPO: smroid/tetra3_server
  TETRA3_SERVER_REF: main
  ASI_CAMERA2_REPO: smroid/asi_camera2
  ASI_CAMERA2_REF: main
  # tetra3rs: the solver crate, pinned. Keep in step with TETRA3RS_REF in the
  # daily rebase job (~/cedar-ci/tetra3rs-rebase.sh), which tests this SHA.
  TETRA3RS_REPO: ssmichael1/tetra3rs
  TETRA3RS_REF: 6f962ca13dee0735cfd553f38f3a033e18edc41b  # v0.14.0-9
  # tetra3rs: the star catalog the pattern database is generated from, pinned by
  # hash, and the field-of-view range the database can solve (see
  # server/src/bin/make_tetra3rs_db.rs for why 10-30 deg).
  GAIA_CATALOG_URL: https://storage.googleapis.com/tetra3rs-testvecs/gaia_merged.bin
  GAIA_CATALOG_SHA256: 95ba872e71d56cab92d706320d1e1533956fa108bc93f6b1383345ef0095faca
  DB_MIN_FOV: 10
  DB_MAX_FOV: 30
  # Name of the .deb this workflow builds (see packaging/deb/build-deb.sh).
  DEB_PACKAGE: cedar-server-tetra3rs  # tetra3rs

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    container:
      image: ghcr.io/trams/cedar-build-arm64:bookworm
      # The package is public, so this is not strictly required today. It is
      # here so the workflow keeps working if the image is ever made private.
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    permissions:
      contents: write  # needed to create a Release on tag pushes
      packages: read   # pull the builder image

    defaults:
      run:
        # REQUIRED for container jobs. On a normal runner GitHub defaults `run`
        # to bash, but inside a container it defaults to `sh -e` because it
        # cannot assume bash exists. Debian's sh is dash, which has no
        # `set -o pipefail`, so every step below would die with
        # "set: Illegal option -o pipefail" before running a single command.
        shell: bash

    steps:
      # --- Check out this repo and every sibling it depends on -------------
      # cedar-server pulls four siblings by relative path, so a lone checkout
      # does not build. The checkout dir for THIS repo must be named exactly
      # `cedar-server`: tetra3_server/Cargo.toml references
      # ../cedar-server/elements, so any other name breaks that path.
      # asi_camera2 is an optional dep (behind cedar-camera's `asi` feature,
      # which is off here) but cargo still needs its Cargo.toml on disk to
      # resolve the graph.
      - name: Checkout cedar-server
        uses: actions/checkout@v4
        with:
          path: cedar-server

      - name: Checkout cedar-camera
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CEDAR_CAMERA_REPO }}
          ref: ${{ env.CEDAR_CAMERA_REF }}
          path: cedar-camera

      - name: Checkout cedar-detect
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CEDAR_DETECT_REPO }}
          ref: ${{ env.CEDAR_DETECT_REF }}
          path: cedar-detect

      - name: Checkout tetra3_server
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TETRA3_SERVER_REPO }}
          ref: ${{ env.TETRA3_SERVER_REF }}
          path: tetra3_server

      - name: Checkout asi_camera2
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ASI_CAMERA2_REPO }}
          ref: ${{ env.ASI_CAMERA2_REF }}
          path: asi_camera2

      # tetra3rs: server/Cargo.toml depends on ../../tetra3rs by path.
      - name: Checkout tetra3rs
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TETRA3RS_REPO }}
          ref: ${{ env.TETRA3RS_REF }}
          path: tetra3rs

      # Siblings track their default branch, so "which code is this?" is not
      # answerable from this repo's SHA alone. Record what actually got built.
      - name: Record resolved sibling revisions
        id: revs
        run: |
          {
            echo "### Build inputs"
            echo
            echo '| repo | ref | resolved SHA |'
            echo '| --- | --- | --- |'
            printf '| cedar-server | `%s` | `%s` |\n' \
              "${GITHUB_REF_NAME}" "$(git -C cedar-server rev-parse HEAD)"
            for pair in \
                "cedar-camera:${CEDAR_CAMERA_REF}" \
                "cedar-detect:${CEDAR_DETECT_REF}" \
                "tetra3_server:${TETRA3_SERVER_REF}" \
                "asi_camera2:${ASI_CAMERA2_REF}" \
                "tetra3rs:${TETRA3RS_REF}"; do
              name="${pair%%:*}"; ref="${pair#*:}"
              printf '| %s | `%s` | `%s` |\n' \
                "$name" "$ref" "$(git -C "$name" rev-parse HEAD)"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cedar-server

      # --- Build ------------------------------------------------------------
      # --features rpi-camera builds the libcamera backend, so the binary can
      # actually drive a Pi camera. TURBOJPEG_STATIC=1 comes from the image.
      - name: Build cedar-box-server (release, rpi-camera)
        working-directory: cedar-server
        run: |
          cargo build --release \
            --package cedar-server \
            --bin cedar-box-server \
            --bin make-tetra3rs-db \
            --features rpi-camera

      # --- Verify the ABI is actually Pi-compatible -------------------------
      # This is the assertion that justifies the whole container setup. If the
      # image base or the runner ever drifts, fail here rather than shipping a
      # binary that cannot start on the target. The checks live in a script so
      # Phase 2 can run the identical assertion against the binary unpacked
      # from the .deb, and so they can be run by hand off CI.
      - name: Verify ABI (glibc ceiling and libcamera soname)
        working-directory: cedar-server
        run: .github/scripts/verify-abi.sh target/release/cedar-box-server 2.36

      # --- Package ----------------------------------------------------------
      - name: Strip and checksum
        id: package
        working-directory: cedar-server
        run: |
          set -euo pipefail
          mkdir --parents dist
          cp target/release/cedar-box-server dist/cedar-box-server
          strip dist/cedar-box-server
          (cd dist && sha256sum cedar-box-server > cedar-box-server.sha256)
          ls --format=long --human-readable dist/
          cat dist/cedar-box-server.sha256
          # Package version: the tag on a tag build, a snapshot otherwise.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=$(packaging/deb/version.sh "${GITHUB_REF_NAME}")" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(packaging/deb/version.sh)" >> "$GITHUB_OUTPUT"
          fi

      # The bare binary needs capabilities to run on the Pi
      #   cap_sys_time,cap_dac_override,cap_chown,cap_fowner,cap_net_bind_service+ep
      # (see build.sh), and file capabilities cannot survive an artifact zip.
      # The .deb's postinst applies them, which is the main reason to prefer it.
      # tetra3rs: build the pattern database and package it as
      # cedar-tetra3rs-db. Its version is the tetra3rs crate version (the
      # database format follows it) plus the FOV range, so it only changes when
      # one of those does.
      - name: Cache Gaia catalog
        uses: actions/cache@v4
        with:
          path: gaia
          key: gaia-${{ env.GAIA_CATALOG_SHA256 }}

      - name: Build cedar-tetra3rs-db .deb
        id: db
        run: |
          set -euo pipefail
          mkdir --parents gaia
          if [ ! -f gaia/gaia_merged.bin ]; then
            curl --fail --silent --show-error --location \
              --output gaia/gaia_merged.bin "$GAIA_CATALOG_URL"
          fi
          echo "${GAIA_CATALOG_SHA256}  gaia/gaia_merged.bin" | sha256sum --check
          cedar-server/target/release/make-tetra3rs-db \
            --gaia_catalog gaia/gaia_merged.bin \
            --out tetra3rs_db.bin \
            --min_fov "$DB_MIN_FOV" --max_fov "$DB_MAX_FOV"
          t3ver=$(sed --quiet 's/^version = "\(.*\)"$/\1/p' tetra3rs/Cargo.toml | head --lines=1)
          [ -n "$t3ver" ] || { echo "no version in tetra3rs/Cargo.toml" >&2; exit 1; }
          major_minor=${t3ver%.*}
          next_minor="${major_minor%.*}.$(( ${major_minor#*.} + 1 ))"
          cedar-server/packaging/deb/build-tetra3rs-db-deb.sh \
            --db tetra3rs_db.bin \
            --version "${t3ver}+fov${DB_MIN_FOV}.${DB_MAX_FOV}" \
            --out cedar-server/dist \
            --description-note "Generated for tetra3rs ${t3ver}, fields of view ${DB_MIN_FOV}-${DB_MAX_FOV} degrees."
          echo "depends=cedar-tetra3rs-db (>= ${major_minor}), cedar-tetra3rs-db (<< ${next_minor}~)" >> "$GITHUB_OUTPUT"

      - name: Build .deb
        working-directory: cedar-server
        run: |
          set -euo pipefail
          packaging/deb/build-deb.sh \
            --package "$DEB_PACKAGE" \
            --binary dist/cedar-box-server \
            --version "${{ steps.package.outputs.version }}" \
            --out dist \
            --provides cedar-server \
            --depends "${{ steps.db.outputs.depends }}" \
            --dropin-extra packaging/deb/tetra3rs.conf \
            --summary "Cedar plate-solving finder server, tetra3rs solver build"

      # Run the same ABI assertion against the binary as it sits inside the
      # .deb, so the check covers what users actually install.
      - name: Verify ABI of the packaged binary
        working-directory: cedar-server
        run: |
          set -euo pipefail
          rm -rf /tmp/deb-root
          dpkg-deb --extract dist/"${DEB_PACKAGE}"_*_arm64.deb /tmp/deb-root
          .github/scripts/verify-abi.sh /tmp/deb-root/usr/bin/cedar-box-server 2.36

      # apt-install the .deb into this very container (bookworm + the Raspberry
      # Pi archive, the same sources a Pi uses), so an unsatisfiable Depends:
      # fails here. Also checks postinst's setcap and that removal is clean.
      - name: Test-install the .deb
        working-directory: cedar-server
        run: |
          set -euo pipefail
          # tetra3rs: the database path the drop-in names must be in the db .deb.
          db_path=$(sed --quiet 's/^Environment=CEDAR_TETRA3RS_DATABASE=//p' packaging/deb/tetra3rs.conf)
          # Capture first: `dpkg-deb | grep --quiet` would kill dpkg-deb with
          # SIGPIPE on the first match, which pipefail reports as a failure.
          contents=$(dpkg-deb --contents dist/cedar-tetra3rs-db_*_all.deb)
          grep --quiet " \.${db_path}\$" <<< "$contents" \
            || { echo "::error::cedar-tetra3rs-db does not ship ${db_path}"; exit 1; }
          packaging/deb/test-install.sh "$DEB_PACKAGE" dist/*.deb

      # One artifact per file, uploaded unzipped (`archive: false`, v7+), so
      # each gets its own download link. With archive off, the artifact is
      # named after the file and `name:` is ignored; `path` must match exactly
      # one file. The run itself identifies the commit.
      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          path: cedar-server/dist/cedar-box-server
          archive: false
          if-no-files-found: error

      - name: Upload checksum
        uses: actions/upload-artifact@v7
        with:
          path: cedar-server/dist/cedar-box-server.sha256
          archive: false
          if-no-files-found: error

      - name: Upload .deb
        uses: actions/upload-artifact@v7
        with:
          path: cedar-server/dist/${{ env.DEB_PACKAGE }}_*_arm64.deb
          archive: false
          if-no-files-found: error

      # tetra3rs: the database package is a fourth file.
      - name: Upload cedar-tetra3rs-db .deb
        uses: actions/upload-artifact@v7
        with:
          path: cedar-server/dist/cedar-tetra3rs-db_*_all.deb
          archive: false
          if-no-files-found: error

      # --- Release (tags only) ----------------------------------------------
      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            cedar-server/dist/cedar-box-server
            cedar-server/dist/cedar-box-server.sha256
            cedar-server/dist/*.deb
          generate_release_notes: true
          body: |
            ARM64 (aarch64) `cedar-box-server` for Raspberry Pi OS **bookworm**,
            **tetra3rs build**: it solves with the built-in Rust tetra3rs solver
            by default, using the database from `cedar-tetra3rs-db` (install
            both `.deb` files together).

            Built with `--features rpi-camera` inside
            `ghcr.io/trams/cedar-build-arm64:bookworm`, so it links glibc 2.36
            and `libcamera.so.0.5` as the Pi provides them. It will **not** run
            on a trixie system (libcamera 0.7).

            **On a Cedar image, install the `.deb`:**

            ```
            sudo apt install ./*.deb
            ```

            It installs `/usr/bin/cedar-box-server`, points the image's
            `cedar.service` at it, applies the file capabilities and restarts
            the service. Removing the package with `sudo apt remove` reverts to
            the image's own binary.

            If you use the bare binary instead, restore the file capabilities
            yourself, since they do not survive the download:

            ```
            sudo setcap cap_sys_time,cap_dac_override,cap_chown,cap_fowner,cap_net_bind_service+ep cedar-box-server
            ```

            See the run's job summary for the exact sibling-repo revisions this
            was built from.
