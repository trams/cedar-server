# cedar-server-tetra3rs: solve with the built-in Rust tetra3rs solver, using
# the database installed by the cedar-tetra3rs-db package. Both can be
# overridden in /etc/default/cedar-server, whose values take precedence over
# Environment= (e.g. CEDAR_SOLVER=tetra3 to go back to the Python solver).
Environment=CEDAR_SOLVER=tetra3rs
Environment=CEDAR_TETRA3RS_DATABASE=/usr/share/cedar-tetra3rs-db/tetra3rs_db.bin
